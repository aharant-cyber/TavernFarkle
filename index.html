<!-- Firebase Modular SDK über CDN -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue, remove, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // TRAGE HIER DEINE EIGENEN FIREBASE CONFIG DATEN EIN!
  const firebaseConfig = {
    apiKey: "DEIN_API_KEY",
    authDomain: "DEIN_PROJEKT.firebaseapp.com",
    databaseURL: "https://DEIN_PROJEKT-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "DEIN_PROJEKT",
    storageBucket: "DEIN_PROJEKT.appspot.com",
    messagingSenderId: "DEINE_MESSAGING_ID",
    appId: "DEINE_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Global verfügbar machen für deine Spiellogik
  window.fb = { db, ref, set, get, update, onValue, remove, child };
  console.log("Firebase erfolgreich verbunden!");
</script>
